<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xzhero UI</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --bg-color: #0b1120;
            --card-bg: #131c31;
            --border-color: #1e293b;
            --text-color: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.3s ease;
        }

        /* Top Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.25rem;
            background-color: var(--bg-color);
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.25rem;
            cursor: pointer;
        }

        .app-title {
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }

        .header-right {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        main {
            padding: 0 1.25rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
        }

        /* Profile Card */
        .profile-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .profile-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            overflow: hidden;
            border: 2px solid var(--primary-color);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-details span {
            font-size: 0.75rem;
            opacity: 0.6;
        }

        .user-name {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .badge-dev {
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 20px;
            letter-spacing: 1px;
            margin-top: 4px;
            display: inline-block;
        }

        .battery-box {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .battery-box small {
            font-size: 0.5rem;
            opacity: 0.7;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }

        .stat-item {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            padding: 0.6rem;
            border-radius: 12px;
            text-align: center;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-item span:last-child {
            font-weight: 600;
            font-size: 0.8rem;
        }

        /* Section Titles */
        .section-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            letter-spacing: 1px;
            font-weight: 600;
            opacity: 0.9;
        }

        /* Anime Banner Container (Swipeable) */
        .banner-container {
            position: relative;
            width: 100%;
        }

        .banner-slider {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            padding-bottom: 0.5rem;
        }

        .banner-slider::-webkit-scrollbar {
            display: none;
        }

        .anime-banner {
            flex: 0 0 100%;
            scroll-snap-align: center;
            height: 200px;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
            cursor: pointer;
        }

        .anime-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Dots Indicator */
        .dots {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 0.25rem;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--border-color);
            transition: background 0.3s;
        }

        .dot.active {
            background-color: var(--primary-color);
            width: 16px;
            border-radius: 4px;
        }

        /* Quick Access / Options */
        .quick-access-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .quick-access-card:active {
            border-color: var(--primary-color);
        }

        .qa-left {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .qa-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary-color), #1d4ed8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .qa-info h4 {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .qa-info p {
            font-size: 0.75rem;
            opacity: 0.6;
        }

        /* Bottom Button */
        .footer-btn {
            background: linear-gradient(135deg, var(--primary-color), #2563eb);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        /* Settings Modal (Drawer/Fullscreen inside) */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding: 1.25rem;
            transform: translateY(100%);
            transition: transform 0.3s ease-in-out;
        }

        .modal.open {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .color-picker-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .color-picker-group label {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .color-presets {
            display: flex;
            gap: 0.75rem;
        }

        .color-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-dot.selected {
            border-color: #fff;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <header>
        <button class="icon-btn" id="menuBtn">&#9776;</button>
        <span class="app-title">Xzhero-v15.0.0</span>
        <div class="header-right">
            <button class="icon-btn" id="settingsBtn">&#9881;</button>
            <button class="icon-btn">&#127911;</button>
            <button class="icon-btn">&#128100;</button>
        </div>
    </header>

    <main>
        <!-- Profile Card -->
        <div class="profile-card">
            <div class="profile-top">
                <div class="profile-info">
                    <div class="avatar">
                        <!-- Substitua pelo link ou imagem da sua foto de perfil -->
                        👤
                    </div>
                    <div class="user-details">
                        <span>Welcome back!</span>
                        <div class="user-name">Ukzz &#10004;</div>
                        <span class="badge-dev">DEVELOPER</span>
                    </div>
                </div>
                <div class="battery-box">
                    100%
                    <small>LEFT</small>
                </div>
            </div>

            <div class="profile-stats">
                <div class="stat-item">
                    <span style="opacity: 0.6;">⚡ ONLINE</span>
                    <span>ON</span>
                </div>
                <div class="stat-item">
                    <span style="opacity: 0.6;">⏳ SISA HARI</span>
                    <span>99740</span>
                </div>
                <div class="stat-item">
                    <span style="opacity: 0.6;">🔗 SESSIONS</span>
                    <span>...</span>
                </div>
            </div>
        </div>

        <!-- Latest News / Anime Banner Slider -->
        <div>
            <div class="section-header" style="margin-bottom: 0.75rem;">
                <span>🔲</span> LATEST NEWS
            </div>
            
            <div class="banner-container">
                <div class="banner-slider" id="bannerSlider">
                    <!-- Banner 1 -->
                    <div class="anime-banner">
                        <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=600&auto=format&fit=crop&q=80" alt="Anime Art">
                    </div>
                    <!-- Banner 2 -->
                    <div class="anime-banner">
                        <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=600&auto=format&fit=crop&q=80" alt="Anime Art 2">
                    </div>
                    <!-- Banner 3 -->
                    <div class="anime-banner">
                        <img src="https://images.unsplash.com/photo-1563089145-599997674d42?w=600&auto=format&fit=crop&q=80" alt="Anime Art 3">
                    </div>
                </div>
                
                <div class="dots">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </div>

        <!-- Quick Access -->
        <div>
            <div class="section-header" style="margin-bottom: 0.75rem;">
                <span>⚡</span> QUICK ACCESS
            </div>
            
            <div class="quick-access-card" onclick="alert('Abrindo Bug Sender...')">
                <div class="qa-left">
                    <div class="qa-icon">🌀</div>
                    <div class="qa-info">
                        <h4>BUG SENDER</h4>
                        <p>management sender</p>
                    </div>
                </div>
                <span style="opacity: 0.5;">&gt;</span>
            </div>
        </div>

        <!-- Bottom Button -->
        <button class="footer-btn">
            <span>✈️</span> DEVELOPER
        </button>
    </main>

    <!-- Tela Cheia / Menu Lateral (Configurações de Cores e Opções) -->
    <div class="modal" id="settingsModal">
        <div class="modal-header">
            <h3>Configurações & Cores</h3>
            <button class="icon-btn" id="closeModalBtn" style="font-size: 1.5rem;">&times;</button>
        </div>

        <div class="color-picker-group">
            <label>Escolha a cor principal do aplicativo:</label>
            <div class="color-presets">
                <div class="color-dot selected" style="background-color: #3b82f6;" data-color="#3b82f6"></div>
                <div class="color-dot" style="background-color: #10b981;" data-color="#10b981"></div>
                <div class="color-dot" style="background-color: #ec4899;" data-color="#ec4899"></div>
                <div class="color-dot" style="background-color: #8b5cf6;" data-color="#8b5cf6"></div>
                <div class="color-dot" style="background-color: #f59e0b;" data-color="#f59e0b"></div>
            </div>
        </div>

        <div class="color-picker-group">
            <label for="customColorInput">Ou escolha uma cor personalizada:</label>
            <input type="color" id="customColorInput" value="#3b82f6" style="width: 100%; height: 40px; border: none; border-radius: 8px; background: none; cursor: pointer;">
        </div>

        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 0.75rem;">
            <p style="font-size: 0.8rem; opacity: 0.6; text-align: center;">Aqui você poderá adicionar as novas opções do app futuramente.</p>
        </div>
    </div>

    <script>
        // Slider dots logic
        const slider = document.getElementById('bannerSlider');
        const dots = document.querySelectorAll('.dot');

        slider.addEventListener('scroll', () => {
            const index = Math.round(slider.scrollLeft / slider.clientWidth);
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
        });

        // Modal Settings (3 barrinhas / Configurações)
        const settingsModal = document.getElementById('settingsModal');
        const menuBtn = document.getElementById('menuBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');

        function toggleModal() {
            settingsModal.classList.toggle('open');
        }

        menuBtn.addEventListener('click', toggleModal);
        settingsBtn.addEventListener('click', toggleModal);
        closeModalBtn.addEventListener('click', toggleModal);

        // Color Customization Logic
        const colorDots = document.querySelectorAll('.color-dot');
        const customColorInput = document.getElementById('customColorInput');

        function changePrimaryColor(color) {
            document.documentElement.style.setProperty('--primary-color', color);
        }

        colorDots.forEach(dot => {
            dot.addEventListener('click', () => {
                colorDots.forEach(d => d.classList.remove('selected'));
                dot.classList.add('selected');
                changePrimaryColor(dot.getAttribute('data-color'));
                customColorInput.value = dot.getAttribute('data-color');
            });
        });

        customColorInput.addEventListener('input', (e) => {
            colorDots.forEach(d => d.classList.remove('selected'));
            changePrimaryColor(e.target.value);
        });
    </script>
</body>
</html>
